# Splunk Security Alerts - Macros Configuration
# Reusable search macros for consistent filtering and analysis

[security_index]
definition = index=main OR index=security OR index=network OR index=windows OR index=linux
iseval = 0

[production_hosts]
definition = lookup sensitive_hosts.csv host OUTPUT is_production | where is_production="true"
iseval = 0

[business_hours]
definition = date_hour>=8 AND date_hour<=18 AND date_wday>=1 AND date_wday<=5
iseval = 0

[after_hours]
definition = (date_hour<8 OR date_hour>18) OR (date_wday=0 OR date_wday=6)
iseval = 0

[external_ip]
definition = NOT (src_ip=10.* OR src_ip=172.16.* OR src_ip=172.17.* OR src_ip=172.18.* OR src_ip=172.19.* OR src_ip=172.20.* OR src_ip=172.21.* OR src_ip=172.22.* OR src_ip=172.23.* OR src_ip=172.24.* OR src_ip=172.25.* OR src_ip=172.26.* OR src_ip=172.27.* OR src_ip=172.28.* OR src_ip=172.29.* OR src_ip=172.30.* OR src_ip=172.31.* OR src_ip=192.168.* OR src_ip=127.* OR src_ip=::1 OR src_ip=fe80::* OR src_ip=fc00::* OR src_ip=fd00::*)
iseval = 0

[internal_ip]
definition = (dest_ip=10.* OR dest_ip=172.16.* OR dest_ip=172.17.* OR dest_ip=172.18.* OR dest_ip=172.19.* OR dest_ip=172.20.* OR dest_ip=172.21.* OR dest_ip=172.22.* OR dest_ip=172.23.* OR dest_ip=172.24.* OR dest_ip=172.25.* OR dest_ip=172.26.* OR dest_ip=172.27.* OR dest_ip=172.28.* OR dest_ip=172.29.* OR dest_ip=172.30.* OR dest_ip=172.31.* OR dest_ip=192.168.* OR dest_ip=127.* OR dest_ip=::1 OR dest_ip=fe80::* OR dest_ip=fc00::* OR dest_ip=fd00::*)
iseval = 0

[suspicious_processes]
definition = process_name IN ("powershell.exe", "cmd.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe", "msiexec.exe", "certutil.exe", "bitsadmin.exe", "psexec.exe", "wmic.exe", "net.exe", "netsh.exe", "sc.exe", "reg.exe", "schtasks.exe", "at.exe", "bash", "sh", "python", "perl", "ruby", "nc", "ncat", "netcat", "socat", "telnet", "ssh", "scp", "wget", "curl", "tftp")
iseval = 0

[admin_accounts]
definition = lookup authorized_users.csv user OUTPUT is_admin | where is_admin="true"
iseval = 0

[high_value_assets]
definition = lookup sensitive_hosts.csv host OUTPUT asset_value | where asset_value="critical" OR asset_value="high"
iseval = 0

[threat_intel_check(1)]
args = ip_field
definition = lookup malicious_ips.csv $ip_field$ OUTPUT is_malicious, threat_type, last_seen | eval threat_score=case(is_malicious="true" AND threat_type="C2", 100, is_malicious="true" AND threat_type="botnet", 90, is_malicious="true", 80, 1=1, 0)
iseval = 0

[normalize_user]
definition = eval user=lower(coalesce(user, username, User, Account_Name, subject_username, target_username, src_user, dest_user))
iseval = 0

[normalize_host]
definition = eval host=lower(coalesce(host, hostname, Computer_Name, ComputerName, dest_host, src_host, system))
iseval = 0

[normalize_ip]
definition = eval src_ip=coalesce(src_ip, src, source_ip, Source_Network_Address, src_addr) | eval dest_ip=coalesce(dest_ip, dest, destination_ip, Destination_Network_Address, dst_addr)
iseval = 0

[calculate_risk_score(3)]
args = base_score, asset_value, threat_score
definition = eval risk_score = $base_score$ * (1 + ($asset_value$/100)) * (1 + ($threat_score$/100))
iseval = 1

[session_tracking]
definition = eval session_id=md5(src_ip.":".user.":".host.":".strftime(_time,"%Y%m%d"))
iseval = 0

[data_classification]
definition = lookup data_classification.csv file_path OUTPUT classification | fillnull value="unclassified" classification
iseval = 0

[geo_lookup]
definition = iplocation src_ip | fillnull value="Unknown" Country City | eval geo_location=Country.", ".City
iseval = 0

[time_window(2)]
args = window_size, time_field
definition = bin $time_field$ span=$window_size$ | stats count by $time_field$
iseval = 0

[baseline_comparison(2)]
args = metric, threshold_multiplier
definition = eventstats avg($metric$) as avg_$metric$, stdev($metric$) as stdev_$metric$ | eval threshold=avg_$metric$ + ($threshold_multiplier$ * stdev_$metric$) | where $metric$ > threshold
iseval = 0

[extract_domain]
definition = rex field=url "^(?<protocol>https?):\/\/(?<domain>[^\/]+)" | rex field=domain "(?<subdomain>[^\.]+)\.(?<root_domain>.+)$"
iseval = 0

[hash_lookup]
definition = lookup file_hashes.csv md5 sha1 sha256 OUTPUT is_malicious, malware_family | fillnull value="unknown" is_malicious malware_family
iseval = 0

[container_context]
definition = eval container_id=substr(container_id,1,12) | lookup container_metadata.csv container_id OUTPUT container_name, pod_name, namespace, image
iseval = 0

[windows_logon_type]
definition = eval logon_type_desc=case(Logon_Type=2, "Interactive", Logon_Type=3, "Network", Logon_Type=4, "Batch", Logon_Type=5, "Service", Logon_Type=7, "Unlock", Logon_Type=8, "NetworkCleartext", Logon_Type=9, "NewCredentials", Logon_Type=10, "RemoteInteractive", Logon_Type=11, "CachedInteractive", 1=1, "Unknown")
iseval = 0

[linux_audit_parser]
definition = rex field=_raw "type=(?<audit_type>\w+).*?msg=audit\((?<audit_time>[\d\.]+):(?<audit_id>\d+)\)" | rex field=_raw "(?:uid|auid)=(?<uid>\d+)" | rex field=_raw "exe=\"(?<exe>[^\"]+)\""
iseval = 0