# Splunk Security Alerts - Saved Searches Configuration
# Production-ready security detection searches

###########################################
# CRITICAL PRIORITY ALERTS
###########################################

[Unauthorized SSH Access from Unknown IPs]
search = index=* source="/var/log/secure*" OR source="/var/log/auth*" OR sourcetype=linux_secure | rex field=_raw "sshd\[\d+\]:\s+(?<ssh_status>Accepted|Failed)\s+(?<auth_method>\S+)\s+for\s+(?<user>\S+)\s+from\s+(?<src_ip>\S+)" | search ssh_status="Accepted" | lookup authorized_ips.csv src_ip OUTPUT authorized | where NOT authorized="true" | stats count by src_ip, user, auth_method, host | where count > 0 | eval severity="critical", alert_name="Unauthorized SSH Access"
description = Detects successful SSH logins from IP addresses not in the authorized whitelist
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 5
action.email = 0
action.script = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = src_ip,user,host
alert.suppress.period = 1h
request.ui_dispatch_app = search
request.ui_dispatch_view = search
display.general.type = statistics
display.page.search.mode = verbose
display.visualizations.type = table
action.notable = 1
action.notable.param.severity = critical
action.notable.param.rule_title = Unauthorized SSH Access Detected
action.notable.param.rule_description = SSH access from non-whitelisted IP address

[Privilege Escalation Detected]
search = index=* (source="/var/log/secure*" OR source="/var/log/auth*" OR EventCode=4672 OR EventCode=4648) | eval escalation_type=case(match(_raw, "sudo.*COMMAND="), "sudo_execution", match(_raw, "su\\[.*authentication success"), "su_escalation", EventCode=4672, "windows_special_logon", EventCode=4648, "windows_explicit_credentials", 1=1, "unknown") | search escalation_type!="unknown" | eval user=coalesce(user, Account_Name, subject_username) | lookup authorized_users.csv user OUTPUT is_admin | where is_admin!="true" | stats count by host, user, escalation_type, _time | eval severity="critical", alert_name="Privilege Escalation"
description = Detects privilege escalation attempts from non-administrative accounts
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 5
action.email = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = host,user
alert.suppress.period = 30m
display.general.type = statistics

[Data Exfiltration Attempt]
search = index=* (sourcetype=firewall OR sourcetype=netflow OR sourcetype=proxy)| eval bytes_out=coalesce(bytes_out, bytes_sent, sc_bytes)| where bytes_out > 104857600| eval dest_ip=coalesce(dest_ip, dst_ip, c_ip)| regex dest_ip="^(?!10\.|172\.1[6-9]\.|172\.2[0-9]\.|172\.3[0-1]\.|192\.168\.)"| lookup malicious_ips.csv dest_ip OUTPUT is_malicious| eval risk_score=case(    is_malicious="true", 100,    bytes_out > 1073741824, 80,    bytes_out > 524288000, 60,    1=1, 40)| stats sum(bytes_out) as total_bytes, values(dest_ip) as dest_ips, max(risk_score) as risk by src_ip, user| eval total_mb=round(total_bytes/1048576, 2)| where total_mb > 100| eval severity="critical", alert_name="Data Exfiltration"
description = Monitors for large data transfers to external IP addresses
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert.track = 1
alert.severity = 5
action.email = 0
alert.digest_mode = 1
display.general.type = statistics

[Persistence Mechanism Created]
search = index=* ((sourcetype=WinEventLog:Security EventCode=4698) OR    (sourcetype=WinEventLog:System EventCode=7045) OR    (source="/var/log/cron*" "REPLACE") OR    (source="/var/log/messages" "systemd" "Started") OR    (sourcetype=linux_audit type=ADD_USER) OR    (registry_path="*\\CurrentVersion\\Run*") OR    (file_path="/etc/rc*.d/*" action=created))| eval persistence_type=case(    EventCode=4698, "scheduled_task",    EventCode=7045, "new_service",    match(_raw, "cron.*REPLACE"), "cron_job",    match(_raw, "systemd.*Started"), "systemd_service",    match(_raw, "ADD_USER"), "new_user",    isnotnull(registry_path), "registry_autorun",    match(file_path, "/etc/rc"), "startup_script",    1=1, "unknown")| search persistence_type!="unknown"| lookup sensitive_hosts.csv host OUTPUT is_sensitive| eval risk_multiplier=if(is_sensitive="true", 2, 1)| eval severity=case(    risk_multiplier=2, "critical",    persistence_type="scheduled_task" OR persistence_type="new_service", "high",    1=1, "medium")| stats count by host, persistence_type, user, severity
description = Detects creation of persistence mechanisms like scheduled tasks, services, or cron jobs
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 4
action.email = 0
alert.digest_mode = 0
display.general.type = statistics

###########################################
# HIGH PRIORITY ALERTS
###########################################

[Lateral Movement Detected]
search = index=* (EventCode=4624 OR EventCode=4648 OR sourcetype=linux_secure "Accepted")| eval logon_type=case(    EventCode=4624 AND Logon_Type=3, "network_logon",    EventCode=4624 AND Logon_Type=10, "remote_interactive",    EventCode=4648, "explicit_credentials",    match(_raw, "sshd.*Accepted"), "ssh_logon",    1=1, "unknown")| search logon_type!="unknown"| eval src_host=coalesce(Workstation_Name, src_host, src)| eval dest_host=coalesce(Computer_Name, dest_host, host)| where src_host!=dest_host AND isnotnull(src_host)| stats dc(dest_host) as unique_targets, values(dest_host) as targets by src_host, user, logon_type| where unique_targets > 5| eval severity="high", alert_name="Lateral Movement"
description = Tracks authentication patterns indicating lateral movement across systems
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.track = 1
alert.severity = 4
action.email = 0
alert.suppress = 1
alert.suppress.fields = src_host,user
alert.suppress.period = 1h
display.general.type = statistics

[Account Manipulation]
search = index=* (EventCode=4720 OR EventCode=4722 OR EventCode=4724 OR EventCode=4728 OR EventCode=4732 OR EventCode=4756 OR    sourcetype=linux_audit (type=ADD_USER OR type=ADD_GROUP OR type=USER_CHAUTHTOK OR type=ADD_USER_TO_GROUP))| eval action=case(    EventCode=4720 OR match(_raw, "ADD_USER"), "user_created",    EventCode=4722, "user_enabled",    EventCode=4724 OR match(_raw, "USER_CHAUTHTOK"), "password_reset",    EventCode=4728 OR EventCode=4732 OR EventCode=4756 OR match(_raw, "ADD_USER_TO_GROUP"), "group_modification",    1=1, "unknown")| search action!="unknown"| eval target_user=coalesce(Target_Account_Name, acct, user)| eval modifier_user=coalesce(Subject_Account_Name, uid, auid)| lookup authorized_users.csv user=modifier_user OUTPUT is_admin| eval risk_score=case(    action="user_created" AND is_admin!="true", 80,    action="group_modification" AND match(Group_Name, "Admin|sudo|wheel"), 90,    action="password_reset" AND target_user!=modifier_user, 70,    1=1, 50)| where risk_score > 60| stats count by action, target_user, modifier_user, host, risk_score
description = Monitors account creation, deletion, and privilege changes
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert.track = 1
alert.severity = 4
action.email = 0
alert.digest_mode = 0
display.general.type = statistics

[Command and Control Beacon]
search = index=* (sourcetype=firewall OR sourcetype=proxy OR sourcetype=dns)| eval dest_domain=coalesce(dest_domain, query, cs_host)| eval dest_ip=coalesce(dest_ip, answer, c_ip)| where isnotnull(dest_domain) OR isnotnull(dest_ip)| bin _time span=5m| stats count, avg(bytes_out) as avg_bytes, stdev(bytes_out) as stdev_bytes by _time, src_ip, dest_domain, dest_ip| eventstats avg(count) as avg_count, stdev(count) as stdev_count by src_ip, dest_domain| eval beacon_score=case(    stdev_count<2 AND avg_count>10, 80,    stdev_bytes<100 AND count>20, 70,    count>50 AND stdev_count<5, 60,    1=1, 0)| where beacon_score > 60| lookup malicious_ips.csv dest_ip OUTPUT is_malicious| eval severity=if(is_malicious="true", "critical", "high")
description = Identifies potential command and control beacon activity
cron_schedule = */30 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
alert.track = 1
alert.severity = 4
action.email = 0
alert.digest_mode = 1
display.general.type = statistics

[Suspicious Process Execution]
search = index=* (sourcetype=WinEventLog:Security EventCode=4688 OR sourcetype=linux_audit type=EXECVE)| eval process_name=coalesce(New_Process_Name, exe, comm)| eval parent_process=coalesce(Creator_Process_Name, parent_exe, parent_comm)| regex process_name="(powershell|cmd|bash|sh|python|perl|ruby|nc|ncat|netcat|psexec|wmic|mshta|rundll32|regsvr32)"| eval suspicious_flags=case(    match(Command_Line, "-enc|-e\s+[A-Za-z0-9+/=]{20,}"), "encoded_command",    match(Command_Line, "bypass|hidden|nop|sta|noni"), "powershell_evasion",    match(Command_Line, "/c\s+.*&.*&|;.*;"), "command_chaining",    match(process_name, "nc|ncat|netcat") AND match(Command_Line, "-l|-e|/bin/sh|cmd.exe"), "reverse_shell",    match(process_name, "rundll32|regsvr32|mshta") AND match(Command_Line, "http|ftp|javascript|vbscript"), "living_off_land",    1=1, "none")| search suspicious_flags!="none"| stats count by host, user, process_name, parent_process, suspicious_flags| eval severity="high", alert_name="Suspicious Process"
description = Detects execution of potentially malicious processes and command patterns
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 4
action.email = 0
alert.suppress = 1
alert.suppress.fields = host,process_name,user
alert.suppress.period = 30m
display.general.type = statistics

###########################################
# MEDIUM PRIORITY ALERTS
###########################################

[Failed Authentication Spike]
search = index=* (EventCode=4625 OR sourcetype=linux_secure "Failed password" OR sourcetype=apache_access status=401)| eval src_ip=coalesce(Source_Network_Address, src_ip, clientip)| eval user=coalesce(Account_Name, user, username)| bin _time span=5m| stats count as failed_attempts, dc(user) as unique_users, values(user) as users by _time, src_ip, host| where failed_attempts > 10| lookup malicious_ips.csv src_ip OUTPUT is_malicious| eval severity=case(    is_malicious="true", "high",    failed_attempts > 50, "high",    failed_attempts > 20, "medium",    1=1, "low")
description = Monitors spikes in authentication failures indicating brute force attempts
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
action.email = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 30m
display.general.type = statistics

[Port Scanning Activity]
search = index=* (sourcetype=firewall action=blocked OR sourcetype=iptables "DPT=" OR sourcetype=snort "portscan")| eval dest_port=coalesce(dest_port, DPT, dst_port)| eval src_ip=coalesce(src_ip, SRC, src_addr)| eval dest_ip=coalesce(dest_ip, DST, dst_addr)| bin _time span=1m| stats dc(dest_port) as unique_ports, values(dest_port) as ports by _time, src_ip, dest_ip| where unique_ports > 20| lookup authorized_scanners.csv src_ip OUTPUT is_authorized| where is_authorized!="true"| eval severity="medium", alert_name="Port Scan"
description = Detects reconnaissance attempts through port scanning
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
action.email = 0
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = src_ip,dest_ip
alert.suppress.period = 1h
display.general.type = statistics

[Unusual Network Protocol]
search = index=* (sourcetype=firewall OR sourcetype=netflow)| eval protocol_num=coalesce(protocol, ip_protocol, proto)| lookup standard_protocols.csv protocol_num OUTPUT protocol_name, is_standard| where is_standard!="true" AND protocol_num NOT IN (6,17,1)| stats count, sum(bytes) as total_bytes by src_ip, dest_ip, protocol_num, protocol_name| where count > 10| eval severity="medium", alert_name="Unusual Protocol"
description = Identifies usage of non-standard network protocols
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
action.email = 0
alert.digest_mode = 1
display.general.type = statistics

[File Integrity Violation]
search = index=* (sourcetype=aide OR sourcetype=tripwire OR sourcetype=fim OR sourcetype=sysmon EventCode=2)| eval file_path=coalesce(file_path, path, TargetFilename)| regex file_path="(/etc/|/bin/|/sbin/|/usr/bin/|/usr/sbin/|C:\\Windows\\System32\\|C:\\Windows\\SysWOW64\\)"| eval change_type=case(    match(_raw, "added|created"), "file_created",    match(_raw, "removed|deleted"), "file_deleted",    match(_raw, "changed|modified"), "file_modified",    match(_raw, "permission|chmod"), "permission_changed",    1=1, "unknown")| search change_type!="unknown"| lookup critical_files.csv file_path OUTPUT is_critical| where is_critical="true" OR match(file_path, "(passwd|shadow|sudoers|hosts|SAM|SYSTEM)")| stats count by host, file_path, change_type, user| eval severity=if(is_critical="true", "high", "medium")
description = Monitors modifications to critical system files
cron_schedule = */10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
action.email = 0
alert.digest_mode = 0
display.general.type = statistics

###########################################
# CORRELATION SEARCHES
###########################################

[Multi-Stage Attack Chain]
search = | multisearch    [ search index=* sourcetype=* alert_name="Port Scan" | eval stage="reconnaissance" ]    [ search index=* sourcetype=* alert_name="Failed Authentication Spike" | eval stage="initial_access" ]    [ search index=* sourcetype=* alert_name="Privilege Escalation" | eval stage="privilege_escalation" ]    [ search index=* sourcetype=* alert_name="Lateral Movement" | eval stage="lateral_movement" ]    [ search index=* sourcetype=* alert_name="Data Exfiltration" | eval stage="exfiltration" ]| eval attack_chain=1| stats values(stage) as stages, dc(stage) as stage_count by src_ip| where stage_count >= 3| eval severity="critical", alert_name="Multi-Stage Attack"
description = Correlates multiple alerts to identify coordinated attack campaigns
cron_schedule = */30 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
alert.track = 1
alert.severity = 5
action.email = 0
alert.digest_mode = 1
display.general.type = statistics