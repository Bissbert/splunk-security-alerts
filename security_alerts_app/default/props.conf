# Splunk Security Alerts - Props Configuration
# Field extractions and data parsing rules

###########################################
# Linux Secure Logs
###########################################
[linux_secure]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 100000
# SSH Authentication Extractions
EXTRACT-ssh_auth = sshd\[\d+\]:\s+(?<ssh_action>Accepted|Failed)\s+(?<auth_method>\S+)\s+for\s+(?:invalid user\s+)?(?<user>\S+)\s+from\s+(?<src_ip>\S+)\s+port\s+(?<src_port>\d+)
EXTRACT-ssh_disconnect = sshd\[\d+\]:\s+Disconnected from\s+(?<src_ip>\S+)\s+port\s+(?<src_port>\d+)
EXTRACT-sudo_command = sudo:\s+(?<sudo_user>\S+)\s+:\s+TTY=(?<tty>\S+)\s+;\s+PWD=(?<pwd>[^;]+)\s+;\s+USER=(?<target_user>\S+)\s+;\s+COMMAND=(?<command>.+)
EXTRACT-su_attempt = su\[(?<pid>\d+)\]:\s+(?<su_action>\S+)\s+su for\s+(?<target_user>\S+)\s+by\s+(?<user>\S+)
EXTRACT-pam_unix = pam_unix\((?<service>[^:]+):(?<pam_type>[^)]+)\):\s+(?<pam_message>.+)
EVAL-severity = case(ssh_action=="Failed", "warning", ssh_action=="Accepted" AND NOT match(src_ip, "^10\.|^172\.|^192\.168\."), "high", 1==1, "info")
FIELDALIAS-linux_secure = src_ip AS source_ip, user AS username

###########################################
# Windows Security Logs
###########################################
[WinEventLog:Security]
SHOULD_LINEMERGE = false
TIME_PREFIX = <TimeCreated SystemTime='
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TRUNCATE = 100000
# Account Logon Events
EXTRACT-logon_info = EventCode=(4624|4625|4634|4647|4648|4672).*?Account Name:\s+(?<Account_Name>[^\s]+).*?Account Domain:\s+(?<Account_Domain>[^\s]+).*?Logon Type:\s+(?<Logon_Type>\d+).*?Source Network Address:\s+(?<Source_Network_Address>[^\s]+)
EXTRACT-logon_failure = EventCode=4625.*?Failure Reason:\s+(?<Failure_Reason>[^\r\n]+).*?Status:\s+(?<Status>0x[0-9A-Fa-f]+).*?Sub Status:\s+(?<Sub_Status>0x[0-9A-Fa-f]+)
EXTRACT-privilege_use = EventCode=4673.*?Privileges:\s+(?<Privileges>[^\r\n]+)
EXTRACT-process_creation = EventCode=4688.*?New Process Name:\s+(?<New_Process_Name>[^\r\n]+).*?Token Elevation Type:\s+(?<Token_Elevation_Type>[^\r\n]+).*?Creator Process Name:\s+(?<Creator_Process_Name>[^\r\n]+)
EXTRACT-account_management = EventCode=(4720|4722|4724|4728|4732|4756).*?Target Account Name:\s+(?<Target_Account_Name>[^\s]+).*?Subject Account Name:\s+(?<Subject_Account_Name>[^\s]+)
EVAL-logon_type_description = case(Logon_Type==2, "Interactive", Logon_Type==3, "Network", Logon_Type==10, "RemoteInteractive", Logon_Type==11, "CachedInteractive", 1==1, "Other")
FIELDALIAS-windows_security = Source_Network_Address AS src_ip, Account_Name AS user, Computer_Name AS host

###########################################
# Network/Firewall Logs
###########################################
[firewall]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 100000
EXTRACT-firewall_common = (?<action>ACCEPT|DROP|DENY|ALLOW|BLOCK)\s+.*?SRC=(?<src_ip>[^\s]+)\s+DST=(?<dest_ip>[^\s]+).*?PROTO=(?<protocol>\w+).*?SPT=(?<src_port>\d+)\s+DPT=(?<dest_port>\d+)
EXTRACT-firewall_tcp_flags = FLAGS:(?<tcp_flags>\S+)
EXTRACT-firewall_bytes = LEN=(?<packet_length>\d+)
EVAL-direction = case(match(dest_ip, "^10\.|^172\.|^192\.168\."), "inbound", 1==1, "outbound")
FIELDALIAS-firewall = src_ip AS source_ip, dest_ip AS destination_ip, src_port AS source_port, dest_port AS destination_port

[iptables]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 100000
EXTRACT-iptables = (?<action>ACCEPT|DROP|REJECT)\s+IN=(?<in_interface>\S*)\s+OUT=(?<out_interface>\S*)\s+.*?SRC=(?<src_ip>[^\s]+)\s+DST=(?<dest_ip>[^\s]+).*?PROTO=(?<protocol>\w+)(?:.*?SPT=(?<src_port>\d+))?\s*(?:DPT=(?<dest_port>\d+))?
EXTRACT-iptables_icmp = TYPE=(?<icmp_type>\d+)\s+CODE=(?<icmp_code>\d+)
FIELDALIAS-iptables = src_ip AS source_ip, dest_ip AS destination_ip

###########################################
# Web Server Logs
###########################################
[apache_access]
SHOULD_LINEMERGE = false
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
TRUNCATE = 100000
EXTRACT-apache = ^(?<client_ip>[^\s]+)\s+(?<ident>[^\s]+)\s+(?<user>[^\s]+)\s+\[(?<timestamp>[^\]]+)\]\s+"(?<method>\w+)\s+(?<uri>[^\s]+)\s+(?<protocol>[^"]+)"\s+(?<status>\d+)\s+(?<bytes>\d+)\s+"(?<referrer>[^"]+)"\s+"(?<user_agent>[^"]+)"
EXTRACT-apache_extended = (?<response_time>\d+)\s+(?<x_forwarded_for>[^\s]+)$
EVAL-status_category = case(status>=200 AND status<300, "success", status>=300 AND status<400, "redirect", status>=400 AND status<500, "client_error", status>=500, "server_error", 1==1, "unknown")
FIELDALIAS-apache = client_ip AS src_ip, uri AS url

[nginx_access]
SHOULD_LINEMERGE = false
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
TRUNCATE = 100000
EXTRACT-nginx = ^(?<client_ip>[^\s]+)\s+-\s+(?<user>[^\s]+)\s+\[(?<timestamp>[^\]]+)\]\s+"(?<method>\w+)\s+(?<uri>[^\s]+)\s+(?<protocol>[^"]+)"\s+(?<status>\d+)\s+(?<bytes>\d+)\s+"(?<referrer>[^"]+)"\s+"(?<user_agent>[^"]+)"
FIELDALIAS-nginx = client_ip AS src_ip, uri AS url

###########################################
# Application Logs
###########################################
[json_application]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "timestamp":
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
TRUNCATE = 100000
EVAL-severity = coalesce(severity, level, log_level, "info")
FIELDALIAS-json_app = client_ip AS src_ip, user_id AS user, event_type AS action

[syslog]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 100000
EXTRACT-syslog = ^(?<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?<hostname>[^\s]+)\s+(?<process>[^\[\]:]+)(?:\[(?<pid>\d+)\])?: (?<message>.+)
EVAL-severity = case(match(_raw, "error|ERROR|Error"), "error", match(_raw, "warn|WARN|Warn|warning|WARNING"), "warning", match(_raw, "crit|CRIT|Critical|CRITICAL"), "critical", 1==1, "info")

###########################################
# Container/Kubernetes Logs
###########################################
[docker]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "time":
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
TRUNCATE = 100000
EXTRACT-docker_container = "container_name":"(?<container_name>[^"]+)".*?"container_id":"(?<container_id>[^"]+)"
FIELDALIAS-docker = container_name AS container, container_id AS container_short_id

[kubernetes]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "timestamp":
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
TRUNCATE = 100000
EXTRACT-k8s_metadata = "pod":"(?<pod>[^"]+)".*?"namespace":"(?<namespace>[^"]+)".*?"container":"(?<container>[^"]+)"
EVAL-k8s_workload = replace(pod, "-[a-z0-9]{5,10}-[a-z0-9]{5}$", "")

###########################################
# Database Audit Logs
###########################################
[mysql_audit]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %Y%m%d %H:%M:%S
TRUNCATE = 100000
EXTRACT-mysql = ^(?<timestamp>\d+\s+\d+:\d+:\d+),(?<server_id>\w+),(?<command_type>\w+),(?<database>[^,]*),(?<user>[^,]*),(?<host>[^,]*),(?<query>.+)
EVAL-is_sensitive_query = case(match(query, "(?i)(password|passwd|secret|token|key)"), "true", 1==1, "false")

[postgresql_audit]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TRUNCATE = 100000
EXTRACT-postgres = ^(?<timestamp>[^,]+),(?<user>[^,]+),(?<database>[^,]+),(?<pid>\d+),(?<client_addr>[^,]+),(?<session_id>[^,]+),(?<command_tag>[^,]+),(?<error_severity>[^,]+),(?<sql_state>[^,]+),(?<message>.+)

###########################################
# Custom Security Tool Logs
###########################################
[aide]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
TRUNCATE = 100000
EXTRACT-aide = (?<change_type>added|removed|changed):\s+(?<file_path>[^\s]+)(?:\s+(?<attributes>.+))?
EVAL-risk_level = case(match(file_path, "(?i)(passwd|shadow|sudoers|ssh|pam\.d)"), "critical", match(file_path, "/etc/"), "high", match(file_path, "/bin/|/sbin/"), "medium", 1==1, "low")

[snort]
SHOULD_LINEMERGE = false
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 32
TRUNCATE = 100000
EXTRACT-snort_alert = \[(?<gid>\d+):(?<sid>\d+):(?<rev>\d+)\]\s+(?<alert_msg>[^\[]+)\s+\[Classification:\s+(?<classification>[^\]]+)\]\s+\[Priority:\s+(?<priority>\d+)\].*?{(?<protocol>\w+)}\s+(?<src_ip>[^:]+):(?<src_port>\d+)\s+->\s+(?<dest_ip>[^:]+):(?<dest_port>\d+)
FIELDALIAS-snort = src_ip AS source_ip, dest_ip AS destination_ip